services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chaosforge
      POSTGRES_USER: chaosforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    volumes:
      - chaosforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chaosforge -d chaosforge"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [control]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://chaosforge:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/chaosforge
      CHAOSFORGE_API_KEY: ${CHAOSFORGE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [control]

networks:
  control:
    internal: true

volumes:
  chaosforge-postgres:
